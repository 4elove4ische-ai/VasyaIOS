name: Build unsigned Vasya IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for physical iPhone without signing
        run: |
          xcodebuild -project Vasya.xcodeproj -scheme Vasya -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for Sideloadly
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Vasya.app Payload/
          zip -qr Vasya-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Vasya-unsigned-ipa
          path: Vasya-unsigned.ipa
